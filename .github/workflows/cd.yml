name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build Wasm
        run: wasm-pack build --target web --release

      - name: Zip Wasm package
        run: zip -r markplus_core-wasm.zip pkg/

      - name: Upload Wasm package
        uses: actions/upload-artifact@v4
        with:
          name: markplus_core-wasm
          path: markplus_core-wasm.zip

  release:
    name: Release
    needs: [build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare release assets
        run: |
          mkdir -p final_assets
          # GitHub Actions download-artifact creates subdirectories for each artifact name.
          # We move them all into one flat directory.
          find release_assets -type f -exec mv {} final_assets/ \;

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ !endsWith(github.ref, '-stable') }}
          files: final_assets/*
