name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build wasm target
        run: wasm-pack build --target web --release

      - name: Set up Python for schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema validator
        run: pip install jsonschema

      - name: Validate sample AST against JSON Schema
        run: |
          cargo run --release --bin mpc -- tests/samples/note_rfsoc_mixer.md \
            | python - << 'EOF'
          import sys, json
          from jsonschema import validate, ValidationError
          ast = json.loads(sys.stdin.read())
          with open("schema/markplus-ast.v1.schema.json") as f:
              schema = json.load(f)
          try:
              validate(instance=ast, schema=schema)
              print("✓ AST validates against schema/markplus-ast.v1.schema.json")
          except ValidationError as e:
              print(f"✗ Schema validation failed: {e.message}")
              print(f"  at path: {list(e.absolute_path)}")
              sys.exit(1)
          EOF
